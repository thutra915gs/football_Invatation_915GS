  <style>
    :root {
      --primary: #0b3d20;
      --primary-light: #166436;
      --gold: #d4af37;
      --gold-light: #f7e7a9;
      --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
      --bg-cream: #faf8f5;
      --text-dark: #22252a;
      --text-muted: #555e68;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #06170d;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Màn hình điện thoại trung tâm */
    .wedding-wrapper {
      width: 100%;
      max-width: 480px;
      background: var(--bg-cream);
      box-shadow: 0 0 35px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
      min-height: 100vh;
    }

    /* 1. MÀN HÌNH BÌ THƯ MỞ ĐẦU (OPENING ENVELOPE) */
    #envelope-screen {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: radial-gradient(circle at center, #134e2c, #061f11);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
      text-align: center;
      transition: all 0.8s cubic-bezier(0.65, 0, 0.35, 1);
    }
    #envelope-screen.opened {
      transform: translateX(-50%) translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }
    .env-stamp {
      width: 80px;
      height: 80px;
      border: 2px dashed var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      animation: pulse 2s infinite;
    }
    .env-stamp i { font-size: 34px; color: var(--gold); }
    .env-sub {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 12px;
    }
    .env-title {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      margin-bottom: 20px;
    }
    .env-btn {
      background: var(--gold-gradient);
      color: #2b1803;
      border: none;
      padding: 14px 34px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
      margin-top: 30px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.2s;
    }
    .env-btn:hover { transform: scale(1.05); }

    /* NÚT BẬT/TẮT NHẠC NỀN */
    .music-player {
      position: fixed;
      top: 20px;
      right: calc(50% - 220px);
      z-index: 999;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(11, 61, 32, 0.85);
      border: 1px solid var(--gold);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
    }
    .music-spin { animation: spin 4s linear infinite; }
